name: CI/CD - pruebas y despliegue

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unitarias:
    name: Unitarias + cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ejecutar pruebas unitarias con umbral de cobertura
        run: npm run test:cov
      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/
          retention-days: 7

  mutacion:
    name: Mutación (calidad de las pruebas)
    needs: unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ejecutar StrykerJS (falla si el puntaje < 70 %)
        run: npm run test:mutation
      - name: Publicar reporte de mutación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutacion
          path: reports/mutation/
          retention-days: 7

  e2e:
    name: Extremo a extremo (Playwright)
    needs: unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Instalar navegador
        run: npx playwright install --with-deps chromium
      - name: Ejecutar pruebas E2E
        run: npm run test:e2e
      - name: Publicar reporte y trazas de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  despliegue:
    name: Despliegue continuo (CD) a GitHub Pages
    needs: [mutacion, e2e]
    # Solo se despliega lo que llega a main con todas las pruebas en verde
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}public/index.html
    steps:
      - uses: actions/checkout@v4
      - name: Preparar el sitio (interfaz + dominio)
        run: mkdir -p _site && cp -r public src _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: publicar
        uses: actions/deploy-pages@v4
