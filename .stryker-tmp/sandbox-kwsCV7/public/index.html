<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reservas — demo de pruebas con IA</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #1f2937; }
    h1 { font-size: 1.4rem; }
    form { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
    label { display: flex; flex-direction: column; font-size: .9rem; gap: .25rem; }
    input, select { padding: .45rem; font-size: 1rem; }
    button { grid-column: span 2; padding: .6rem; font-size: 1rem; cursor: pointer; }
    #mensaje { margin: 1rem 0; padding: .6rem; border-radius: 6px; }
    #mensaje.ok { background: #dcfce7; }
    #mensaje.error { background: #fee2e2; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid #e5e7eb; padding: .4rem; text-align: left; }
  </style>
</head>
<body>
  <h1>Registrar reserva (RF-01)</h1>
  <form id="form-reserva">
    <label>Recurso
      <select name="recurso" id="recurso">
        <option value="Sala A">Sala A (capacidad 10)</option>
        <option value="Mesa 1">Mesa 1 (capacidad 4)</option>
      </select>
    </label>
    <label>Fecha <input type="date" name="fecha" id="fecha" required></label>
    <label>Hora de inicio <input type="time" name="horaInicio" id="horaInicio" required></label>
    <label>Duración (min)
      <select name="duracion" id="duracion">
        <option>30</option><option selected>60</option><option>90</option><option>120</option>
      </select>
    </label>
    <label>Personas <input type="number" name="personas" id="personas" min="1" value="2"></label>
    <label>Responsable <input type="text" name="responsable" id="responsable"></label>
    <button type="submit">Registrar</button>
  </form>

  <div id="mensaje" role="status" aria-live="polite"></div>

  <h2>Agenda</h2>
  <table>
    <thead><tr><th>#</th><th>Recurso</th><th>Fecha</th><th>Horario</th><th>Personas</th><th>Responsable</th><th></th></tr></thead>
    <tbody id="lista"></tbody>
  </table>

  <script type="module" src="./app.js"></script>
</body>
</html>
